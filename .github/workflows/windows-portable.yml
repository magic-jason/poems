name: Windows Portable Build

on:
  workflow_dispatch:

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-portable:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Type check frontend
        run: npm run lint

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build portable package
        run: npm run package:portable

      - name: Upload portable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: poetry-painting-win-x64-portable
          path: |
            dist-portable/poetry-painting-win-x64-portable.zip
            dist-portable/墨韵灵笔/**
          if-no-files-found: error
          retention-days: 14
